<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="SecureSeal — Fabric Waterproofer and Seam Seal. No Leaks. No Excuses.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F7A823" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="75%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F7A823" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F7A823" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0c0c0c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#F7A823"/>
  <rect x="0" y="622" width="1200" height="8" fill="#F7A823"/>

  <!-- kicker -->
  <g transform="translate(80,140)">
    <rect x="0" y="-6" width="40" height="3" fill="#F7A823"/>
    <text x="56" y="0" font-family="Arial, sans-serif" font-weight="700" font-size="22"
          fill="#F7A823" letter-spacing="6">FABRIC WATERPROOFER &amp; SEAM SEAL</text>
  </g>

  <!-- headline -->
  <text x="76" y="320" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="150" fill="#f0ede8" letter-spacing="-4">NO LEAKS.</text>
  <text x="76" y="450" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="150" fill="#F7A823" letter-spacing="-4">NO EXCUSES.</text>

  <!-- subline -->
  <text x="80" y="530" font-family="Arial, sans-serif" font-weight="500" font-size="30"
        fill="#c8c4bc">Proven for over a decade in South Africa &amp; Australia · Made in SA</text>

  <!-- price badge -->
  <g transform="translate(960,470) rotate(-4)">
    <rect x="0" y="0" width="180" height="96" fill="#F7A823"/>
    <text x="20" y="62" font-family="Arial Black, Arial, sans-serif" font-weight="900"
          font-size="60" fill="#0c0c0c">R199</text>
    <text x="22" y="84" font-family="Arial, sans-serif" font-weight="700" font-size="16"
          fill="#0c0c0c" letter-spacing="3">250g TUB</text>
  </g>
</svg>
